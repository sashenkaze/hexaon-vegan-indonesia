<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hexaon-vegan-indonesia/assets/images/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PT Hexaon Vegan Indonesia (HVI) — Coconut Plantation Supplier &amp; Export Partner</title>
    <meta name="description" content="PT Hexaon Vegan Indonesia (HVI) — Indonesian coconut plantation supplier and multi-category export partner." />
    <script>
      // GitHub Pages SPA redirect — restore path from query param
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Handle ?p= from 404.html
        var search = location.search;
        if (search) {
          var p = search.slice(1).split('&').find(function(s){ return s.startsWith('p=/'); });
          if (p) {
            var path = p.slice(2).replace(/~and~/g, '&');
            history.replaceState(null, null, '/hexaon-vegan-indonesia' + path || '/hexaon-vegan-indonesia/');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
